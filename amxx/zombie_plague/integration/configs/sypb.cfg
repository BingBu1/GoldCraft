// SyPB 1.50: GoldCraft ZP owns infection/team state.
// Keep 25 total clients: one human + 24 Bots, with seven free slots on a 32-slot server.
// The native quota manager removes Bots as humans connect and refills after disconnect.
mp_auto_join_team 0
humans_join_team any
sypb_gamemod 2
sypb_quota 24
sypb_quota_save -1
sypb_auto_players 25
sypb_join_after_player 0
sypb_difficulty 2
sypb_download_waypoint 0
sypb_chat 0
sypb_nametag 0
