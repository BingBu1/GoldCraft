// 大灾变本地通关策略。供服务器配置显式 exec；不会立即换图。
// 原版一基难度：1入门、2普通、3困难、4噩梦、5地狱、6炼狱、7炼狱Ⅰ。
// 地图限制由 C++ 读取原 maplist；穷途末路允许1..6。
// 只在下一次完整地图初始化应用，sv_restart不重载难度。
csol_scenario_difficulty "1"

// 0：保留通关后的地图，可移动/射击/复活，不重放末阶段刷怪。
// 1：结算等待结束后请求切换 csol_scenario_nextmap。
csol_scenario_finish_action "0"
csol_scenario_nextmap "zs_deadend"

// 下一图仍须使用大灾变模式；不要在此文件修改 csol_game_mode。
// 当前实际战斗支持仅 zs_deadend/subtype1；其他目标保留本图并记录错误。
