# Copy to a private server-runtime directory, outside FastDL and publication.
# PGSERVICEFILE points to that private copy. Never use a game cvar/password arg.
# Configure only after the intended database, role and host are confirmed.
[goldcraft]
# host = certificate-host-name
# hostaddr = numeric-address
# port = confirmed-port
# dbname = confirmed-database
# user = limited-runtime-role
# passfile = absolute-private-passfile-path
sslmode = verify-full
channel_binding = require
connect_timeout = 4
# sslrootcert = absolute-ca-certificate-path
# For a deliberately local-only PostgreSQL instance without TLS, the operator
# may explicitly choose a loopback-only policy. Do not silently downgrade TLS.
